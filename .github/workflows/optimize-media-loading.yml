name: Optimize portfolio media loading

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    # Skip the workflow's own optimization commit to avoid loops.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Optimize video loading in homepage
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          helper = '''\nfunction LazyPreviewVideo({\n  src,\n  poster,\n  className,\n}: {\n  src: string;\n  poster?: string;\n  className?: string;\n}) {\n  const ref = React.useRef<HTMLVideoElement>(null);\n  const [shouldLoad, setShouldLoad] = React.useState(false);\n\n  React.useEffect(() => {\n    const video = ref.current;\n    if (!video) return;\n\n    const observer = new IntersectionObserver(\n      ([entry]) => {\n        if (entry.isIntersecting) {\n          setShouldLoad(true);\n          observer.disconnect();\n        }\n      },\n      { rootMargin: '300px 0px' }\n    );\n\n    observer.observe(video);\n    return () => observer.disconnect();\n  }, []);\n\n  return (\n    <video\n      ref={ref}\n      src={shouldLoad ? src : undefined}\n      poster={poster}\n      autoPlay={shouldLoad}\n      muted\n      loop\n      playsInline\n      preload="none"\n      className={className}\n    />\n  );\n}\n'''

          if 'function LazyPreviewVideo' not in text:
              marker = 'export default function Portfolio() {'
              text = text.replace(marker, helper + '\n' + marker, 1)

          # Preview cards: keep the exact poster/card styling, but do not request MP4s
          # until the card is close to entering the viewport.
          patterns = [
              (r'<video\s+src="/videos/main\.mp4"\s+poster="/videos/thumb1\.jpg"\s+autoPlay\s+muted\s+loop\s+className="([^"]+)"\s*/>',
               r'<LazyPreviewVideo src="/videos/main.mp4" poster="/videos/thumb1.jpg" className="\1" />'),
              (r'<video\s+src="/videos/AQMKKr8tc8mqMomgTp0yvDM0SonscX5DheqZb0A8PcLMvAL8fWWTL8KIQtvSoHBa4R9aOyVBFYzo2xlyDSysz_57MMNuIhtx65L1Im45Kg\.mp4"\s+poster="/videos/thumb2\.jpg"\s+autoPlay\s+muted\s+loop\s+className="([^"]+)"\s*/>',
               r'<LazyPreviewVideo src="/videos/AQMKKr8tc8mqMomgTp0yvDM0SonscX5DheqZb0A8PcLMvAL8fWWTL8KIQtvSoHBa4R9aOyVBFYzo2xlyDSysz_57MMNuIhtx65L1Im45Kg.mp4" poster="/videos/thumb2.jpg" className="\1" />'),
              (r'<video\s+src="/videos/AQOKsDmJ8VnS7Kh99V0l4Fwgiu0ViZnniPzTFvmS2aEfsrXe5twZkJd2N9GwZpx0a_GXkTcdIkd9GHhLY6R78DAylhJbnMZYT58KQvlAiZThIg\.mp4"\s+autoPlay muted loop playsInline\s+className="([^"]+)"\s*/>',
               r'<LazyPreviewVideo src="/videos/AQOKsDmJ8VnS7Kh99V0l4Fwgiu0ViZnniPzTFvmS2aEfsrXe5twZkJd2N9GwZpx0a_GXkTcdIkd9GHhLY6R78DAylhJbnMZYT58KQvlAiZThIg.mp4" className="\1" />'),
              (r'<video\s+src="/videos/AQO1So12voezPc1KQwH5LFJPTGZYHbzCgfqvClz0-Bcafh9e06klMBh_tVCxjRZ4k2ZYZaQrbWI6BEyRbiZpBWqA4S6Y1Pg-e8SuMNNmVek7hw\.mp4"\s+autoPlay muted loop playsInline\s+className="([^"]+)"\s*/>',
               r'<LazyPreviewVideo src="/videos/AQO1So12voezPc1KQwH5LFJPTGZYHbzCgfqvClz0-Bcafh9e06klMBh_tVCxjRZ4k2ZYZaQrbWI6BEyRbiZpBWqA4S6Y1Pg-e8SuMNNmVek7hw.mp4" className="\1" />'),
          ]

          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one video replacement, got {count}: {pattern}')

          # The popup video is user-initiated, so it can keep loading only after click.
          text = text.replace(
              '                      controls \n                      autoPlay \n                      className="w-full h-full object-contain"',
              '                      controls\n                      autoPlay\n                      playsInline\n                      preload="metadata"\n                      className="w-full h-full object-contain"',
              1,
          )

          path.write_text(text, encoding='utf-8')

      - name: Convert software logo images to Next Image
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''<img \n                src={`/logos/${skill.img}`} \n                alt={skill.name} \n                className="w-full h-full object-contain filter grayscale group-hover:grayscale-0 transition-all duration-500"\n            />'''
          new = '''<Image\n                src={`/logos/${skill.img}`}\n                alt={skill.name}\n                width={48}\n                height={48}\n                sizes="48px"\n                className="w-full h-full object-contain filter grayscale group-hover:grayscale-0 transition-all duration-500"\n            />'''
          if old not in text:
              raise SystemExit('Software logo image block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove one-shot workflow and commit optimization
        shell: bash
        run: |
          rm -f .github/workflows/optimize-media-loading.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/optimize-media-loading.yml
          git diff --cached --quiet && exit 0
          git commit -m "perf: lazy-load portfolio media"
          git push
